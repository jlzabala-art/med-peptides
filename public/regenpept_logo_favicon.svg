<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="atlasTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background (Light / Dark contrast & high visibility) -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#0f172a" filter="url(#badgeShadow)" />
  <rect x="2" y="2" width="44" height="44" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Stylized "A" in Vibrant Gradient -->
  <path
    d="M12 37 L24 10 L36 37"
    stroke="url(#atlasTealGrad)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Precision EKG / Heartbeat Crossbar in Neon Cyan -->
  <path
    d="M15 28 L19 28 L21 23 L23 33 L25 21 L27 31 L29 28 L33 28"
    stroke="#38bdf8"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Apex Focal Point -->
  <circle cx="24" cy="10" r="2.2" fill="#38bdf8" />
</svg>
