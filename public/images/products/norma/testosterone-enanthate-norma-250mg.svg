<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    
    <!-- Shadow filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glass ampoule amber gradient -->
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#b45309" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Oily liquid inside -->
    <linearGradient id="oilyLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Box gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003666"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Clinical Grid -->
  <g opacity="0.06" stroke="#003666" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
  </g>

  <!-- Ground reflection / pedestal -->
  <ellipse cx="400" cy="710" rx="340" ry="28" fill="#000000" opacity="0.1" filter="blur(8px)"/>

  <!-- ── 1. PHARMACEUTICAL CARTON BOX (Back / Left) ── -->
  <g filter="url(#dropShadow)" transform="translate(130, 160)">
    <!-- Box Body -->
    <rect x="0" y="0" width="340" height="510" rx="12" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Top Blue Band -->
    <path d="M 0,12 Q 0,0 12,0 L 328,0 Q 340,0 340,12 L 340,84 L 0,84 Z" fill="url(#headerBlue)"/>
    
    <!-- Norma Brand Oval in Box Header -->
    <ellipse cx="170" cy="42" rx="72" ry="24" fill="#ffffff"/>
    <text x="170" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" fill="#003666" text-anchor="middle" letter-spacing="2">NORMA</text>
    
    <!-- Product Title & Details -->
    <text x="24" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.5">Testosterone Enanthate</text>
    <text x="24" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#0284c7">250 mg / ml</text>
    <text x="24" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#64748b">Solution for injection • I.M.</text>
    
    <!-- Red/Orange Rx Alert Line -->
    <rect x="24" y="204" width="292" height="3" fill="#ea580c" rx="1.5"/>
    <text x="24" y="224" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#ea580c" letter-spacing="0.5">PRESCRIPTION MEDICINE • USO INTRAMUSCULAR</text>

    <!-- Composition specs -->
    <g transform="translate(24, 250)">
      <rect x="0" y="0" width="292" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">1 ampoule of 1 ml contains:</text>
      <text x="14" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">• Testosterone Enanthate: 250 mg</text>
      <text x="24" y="60" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b">(equiv. to 180 mg pure Testosterone)</text>
      <text x="14" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#475569">Excipients: Benzyl Benzoate, Castor Oil</text>
      <text x="14" y="98" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#0284c7">ATC: G03BA03 • Clear oily solution</text>
    </g>

    <!-- Bottom Specs & QR/Barcode -->
    <g transform="translate(24, 385)">
      <text x="0" y="14" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">Batch / Lote: <tspan font-family="monospace" font-weight="800" fill="#0f172a">G3WTW1E</tspan></text>
      <text x="0" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">Caducidad / Exp: <tspan font-family="monospace" font-weight="800" fill="#0f172a">30.04.2028</tspan></text>
      <text x="0" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">MA Number: <tspan font-weight="700" fill="#0f172a">45945/03-10-2008</tspan></text>
      
      <!-- Fake Barcode -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="3" height="34" fill="#0f172a"/>
        <rect x="5" y="0" width="1" height="34" fill="#0f172a"/>
        <rect x="8" y="0" width="4" height="34" fill="#0f172a"/>
        <rect x="14" y="0" width="2" height="34" fill="#0f172a"/>
        <rect x="18" y="0" width="1" height="34" fill="#0f172a"/>
        <rect x="22" y="0" width="3" height="34" fill="#0f172a"/>
        <rect x="28" y="0" width="5" height="34" fill="#0f172a"/>
        <rect x="36" y="0" width="2" height="34" fill="#0f172a"/>
        <rect x="40" y="0" width="1" height="34" fill="#0f172a"/>
        <rect x="44" y="0" width="4" height="34" fill="#0f172a"/>
        <rect x="50" y="0" width="2" height="34" fill="#0f172a"/>
        <rect x="56" y="0" width="3" height="34" fill="#0f172a"/>
        <rect x="62" y="0" width="1" height="34" fill="#0f172a"/>
        <rect x="66" y="0" width="4" height="34" fill="#0f172a"/>
        <text x="0" y="44" font-family="monospace" font-size="8" fill="#64748b">5201247380108</text>
      </g>
      
      <!-- EU GMP Seal -->
      <g transform="translate(180, 60)">
        <circle cx="28" cy="20" r="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="28" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="9" fill="#16a34a" text-anchor="middle">EU GMP</text>
        <text x="28" y="27" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="7" fill="#15803d" text-anchor="middle">CERTIFIED</text>
      </g>
    </g>
  </g>

  <!-- ── 2. AMBER GLASS AMPOULE (Front / Right) ── -->
  <g filter="url(#glassShadow)" transform="translate(480, 220)">
    <!-- Ampoule Tip / Neck / Body Path -->
    <!-- Top bulb -->
    <path d="M 52,10 Q 60,0 68,10 L 76,40 Q 82,48 76,56 L 68,70 L 68,95 Q 68,110 50,118 Q 30,126 30,145 L 30,380 Q 30,420 60,420 Q 90,420 90,380 L 90,145 Q 90,126 70,118 Q 52,110 52,95 Z" 
          fill="url(#amberGlass)" stroke="#78350f" stroke-width="2"/>
    
    <!-- Liquid Content inside body -->
    <path d="M 32,210 L 88,210 L 88,380 Q 88,416 60,416 Q 32,416 32,380 Z" 
          fill="url(#oilyLiquid)" opacity="0.92"/>

    <!-- Meniscus curved top -->
    <ellipse cx="60" cy="210" rx="28" ry="5" fill="#fef08a" opacity="0.8"/>

    <!-- Ampoule Color Break Ring (Red / Blue break dot) -->
    <ellipse cx="60" cy="72" rx="10" ry="2" fill="#ef4444"/>
    <circle cx="60" cy="72" r="3" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>

    <!-- Ampoule Silk-screened Print -->
    <g transform="translate(34, 230)">
      <rect x="2" y="0" width="50" height="90" fill="#ffffff" opacity="0.12" rx="4"/>
      <text x="27" y="18" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NORMA®</text>
      <text x="27" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#ffffff" text-anchor="middle">TESTOSTERONE</text>
      <text x="27" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#ffffff" text-anchor="middle">ENANTHATE</text>
      <text x="27" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#fef08a" text-anchor="middle">250 mg/ml</text>
      <text x="27" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">1 ml • I.M. only</text>
      <text x="27" y="69" font-family="monospace" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">LOT G3WTW1E</text>
      <text x="27" y="78" font-family="monospace" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">EXP 04.2028</text>
    </g>

    <!-- Glass Specular Highlight (Reflection line) -->
    <path d="M 36,150 L 36,370" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" filter="blur(1px)"/>
    <path d="M 40,150 L 40,370" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- ── 3. FLOATING CERTIFICATION BADGE ── -->
  <g transform="translate(460, 100)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="260" height="74" rx="12" fill="#ffffff" stroke="#003666" stroke-width="2"/>
    <circle cx="36" cy="37" r="22" fill="#003666"/>
    <!-- Checkmark icon -->
    <path d="M 26,37 L 33,44 L 47,30" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#003666" text-transform="uppercase" letter-spacing="0.5">HPLC Purity: 102.5%</text>
    <text x="70" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#16a34a">Batch G3WTW1E Conforms</text>
    <text x="70" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" fill="#64748b">EVER Pharma Jena • Released 2026</text>
  </g>
</svg>
