<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="90%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="actuatorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>

  <!-- Ground Shadows -->
  <ellipse cx="200" cy="358" rx="85" ry="14" fill="#000000" opacity="0.16"/>
  <ellipse cx="200" cy="358" rx="55" ry="7" fill="#000000" opacity="0.22"/>

  <!-- Dispenser Group -->
  <g filter="url(#dropShadow)">
    <!-- Foam Dispensing Actuator & Spout -->
    <!-- Metered Nozzle Spout pointing left -->
    <path d="M 174 68 C 160 70 148 76 142 84 L 140 92 L 154 92 C 160 86 170 82 178 82 Z" fill="#0284c7"/>
    <ellipse cx="141" cy="88" rx="3.5" ry="4.5" fill="#0369a1"/>

    <!-- Foam Actuator Head (Topi-Pump Press Button) -->
    <path d="
      M 174 60 
      C 174 54 184 48 200 48 
      C 216 48 226 54 226 60 
      L 226 102 
      L 174 102 
      Z" 
      fill="url(#actuatorGrad)" stroke="#cbd5e1" stroke-width="0.8"/>
    
    <!-- Finger Grooves on Actuator Top -->
    <line x1="185" y1="56" x2="215" y2="56" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="188" y1="62" x2="212" y2="62" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Collar / Thread Ring -->
    <rect x="168" y="102" width="64" height="18" rx="3" fill="#0ea5e9"/>
    <line x1="172" y1="110" x2="228" y2="110" stroke="#0284c7" stroke-width="1.2"/>

    <!-- Canister Neck -->
    <rect x="176" y="120" width="48" height="10" fill="#cbd5e1"/>

    <!-- Main Canister Body (100 mL Cylindrical Foam Dispenser) -->
    <rect x="140" y="130" width="120" height="220" rx="8" fill="url(#canisterGrad)" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Specular Highlight Strip -->
    <rect x="150" y="132" width="12" height="216" fill="#ffffff" opacity="0.6"/>

    <!-- Clinical Label (Front Panel) -->
    <rect x="146" y="174" width="108" height="150" rx="4" fill="url(#labelGrad)" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Sky Blue / Cyan Medical Header Strip -->
    <rect x="146" y="174" width="108" height="22" rx="4" fill="#0284c7"/>
    <rect x="146" y="192" width="108" height="4" fill="#0284c7"/>
    <text x="200" y="189" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">TRICHOFOAM™</text>

    <!-- Label Subtitle & Clinical Details -->
    <text x="200" y="208" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.2" font-weight="750" text-anchor="middle">EPICUTANEOUS FOAM</text>
    <text x="200" y="219" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.3" font-weight="700" text-anchor="middle">METERED FOAM VEHICLE</text>

    <line x1="154" y1="225" x2="246" y2="225" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Magistral / Compounded Formula Badge -->
    <rect x="154" y="230" width="92" height="34" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.7"/>
    <text x="200" y="241" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="700" text-anchor="middle">TRIPLE REACTIVATOR</text>
    <text x="200" y="251" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.4" font-weight="600" text-anchor="middle">Minoxidil 4% · Dutasteride 0.25%</text>
    <text x="200" y="260" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.2" font-weight="600" text-anchor="middle">+ IGrantine-F1™ 0.5%</text>

    <!-- Volume & Rx Footnote -->
    <rect x="154" y="270" width="92" height="15" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="160" y="280" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="600">VOL: 100 mL</text>
    <text x="238" y="280" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="700" text-anchor="end">Rx ONLY</text>

    <!-- Micro Foam Bubble Graphical Icon -->
    <g transform="translate(190, 292)">
      <circle cx="5" cy="5" r="4" fill="none" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="12" cy="3" r="3" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="15" cy="8" r="2" fill="none" stroke="#7dd3fc" stroke-width="0.7"/>
      <text x="10" y="20" fill="#64748b" font-family="monospace" font-size="4.8" text-anchor="middle">PHARM-FOAM-100</text>
    </g>
  </g>

  <!-- Clinical Quality Watermark / Stamp -->
  <g transform="translate(308, 48)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="0" y="-8" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">100 mL</text>
    <text x="0" y="2" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="800" text-anchor="middle">FOAM</text>
    <text x="0" y="12" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" text-anchor="middle">TOPI-PUMP</text>
  </g>
</svg>
