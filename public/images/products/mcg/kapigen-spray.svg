<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b38" />
      <stop offset="70%" stop-color="#06131c" />
      <stop offset="100%" stop-color="#02080d" />
    </radialGradient>

    <!-- Bottle Gradients -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#142129" />
      <stop offset="35%" stop-color="#2c3e4c" />
      <stop offset="65%" stop-color="#1b2a34" />
      <stop offset="100%" stop-color="#0d161c" />
    </linearGradient>

    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3b47" />
      <stop offset="40%" stop-color="#486275" />
      <stop offset="70%" stop-color="#2a3b47" />
      <stop offset="100%" stop-color="#18232b" />
    </linearGradient>

    <!-- Teal Foil Gradient -->
    <linearGradient id="tealFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGlow)" rx="24" />

  <!-- Subtle Bio-Grid Pattern -->
  <g opacity="0.08" stroke="#2dd4bf" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="0" y1="600" x2="800" y2="600" />
  </g>

  <!-- Ground Reflection Glow -->
  <ellipse cx="400" cy="710" rx="280" ry="35" fill="#0d9488" opacity="0.18" filter="url(#glow)" />
  <ellipse cx="400" cy="710" rx="240" ry="20" fill="#000000" opacity="0.7" />

  <!-- ─── BOTTLE 1 (LEFT - BACKGROUND OFFSET) ─── -->
  <g transform="translate(240, 150) scale(0.9)" opacity="0.95" filter="url(#shadow)">
    <!-- Nozzle Base & Extended Spray Arm -->
    <rect x="75" y="40" width="30" height="45" rx="4" fill="url(#capGrad)" />
    <!-- Spray Head -->
    <path d="M 65 35 L 115 35 Q 120 35 120 40 L 120 55 Q 120 60 115 60 L 65 60 Q 60 60 60 55 L 60 40 Q 60 35 65 35 Z" fill="#1b2a34" />
    <!-- Extended Swivel Precision Nozzle -->
    <path d="M 60 45 L 20 42 Q 15 42 15 48 L 15 52 Q 15 58 20 58 L 60 55 Z" fill="url(#tealFoil)" />
    <circle cx="15" cy="50" r="3" fill="#ffffff" />
    <!-- Shoulder -->
    <path d="M 90 85 L 30 140 Q 20 150 20 165 L 20 510 Q 20 530 40 530 L 140 530 Q 160 530 160 510 L 160 165 Q 160 150 150 140 Z" fill="url(#bottleGrad)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Label Background -->
    <rect x="26" y="190" width="128" height="300" rx="8" fill="#0c171e" stroke="#1e293b" stroke-width="1.5" />
    <!-- Label Header -->
    <text x="90" y="225" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="2">MCG MEDICAL</text>
    <text x="90" y="255" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">KAPIGEN</text>
    <rect x="50" y="268" width="80" height="2" fill="url(#tealFoil)" />
    <text x="90" y="290" text-anchor="middle" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">5% PROCAPIL®</text>
    <text x="90" y="315" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">ANTI HAIR LOSS SPRAY</text>
    <text x="90" y="340" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8">Biotin • Panthenol • Menthol</text>
    <text x="90" y="355" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8">Phytokeratin Complex</text>
    <!-- Volume -->
    <rect x="60" y="440" width="60" height="18" rx="4" fill="#0f2b38" stroke="#0d9488" stroke-width="0.8" />
    <text x="90" y="452" text-anchor="middle" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">75 mL e</text>
  </g>

  <!-- ─── BOTTLE 2 (FOREGROUND HERO - CENTER/RIGHT) ─── -->
  <g transform="translate(380, 130)" filter="url(#shadow)">
    <!-- Nozzle Base & Extended Spray Arm -->
    <rect x="75" y="40" width="30" height="45" rx="4" fill="url(#capGrad)" />
    <!-- Spray Head -->
    <path d="M 65 35 L 115 35 Q 120 35 120 40 L 120 55 Q 120 60 115 60 L 65 60 Q 60 60 60 55 L 60 40 Q 60 35 65 35 Z" fill="#1b2a34" />
    <!-- Extended Swivel Precision Nozzle Pointing Right -->
    <path d="M 120 45 L 165 42 Q 170 42 170 48 L 170 52 Q 170 58 165 58 L 120 55 Z" fill="url(#tealFoil)" />
    <circle cx="170" cy="50" r="3.5" fill="#ffffff" />
    <!-- Fine Spray Mist Particle Effect -->
    <g opacity="0.75">
      <circle cx="185" cy="46" r="1.5" fill="#5eead4" />
      <circle cx="195" cy="42" r="1.2" fill="#2dd4bf" />
      <circle cx="205" cy="52" r="1.8" fill="#99f6e4" />
      <circle cx="215" cy="45" r="1" fill="#5eead4" />
      <circle cx="225" cy="38" r="1.5" fill="#2dd4bf" />
      <circle cx="235" cy="48" r="1.2" fill="#5eead4" />
    </g>

    <!-- Shoulder & Bottle Body -->
    <path d="M 90 85 L 25 140 Q 15 150 15 165 L 15 520 Q 15 540 35 540 L 145 540 Q 165 540 165 520 L 165 165 Q 165 150 155 140 Z" fill="url(#bottleGrad)" stroke="#5eead4" stroke-width="1.2" stroke-opacity="0.6" />
    
    <!-- Light Reflection Sheen on Bottle -->
    <path d="M 30 165 L 45 165 L 45 530 L 30 530 Z" fill="#ffffff" opacity="0.06" />

    <!-- Premium Clinical Label -->
    <rect x="22" y="185" width="136" height="320" rx="10" fill="#0b151c" stroke="url(#tealFoil)" stroke-width="1.8" />
    
    <!-- Label Header -->
    <text x="90" y="215" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="2">MCG MEDICAL</text>
    <text x="90" y="248" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5">KAPIGEN</text>
    <rect x="45" y="260" width="90" height="2.5" fill="url(#tealFoil)" />

    <!-- Clinical Badge Tag -->
    <rect x="36" y="275" width="108" height="24" rx="4" fill="url(#tealFoil)" />
    <text x="90" y="291" text-anchor="middle" fill="#042f2e" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">5% PROCAPIL®</text>

    <!-- Subtitle -->
    <text x="90" y="322" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">ANTI-HAIR LOSS SPRAY</text>
    <text x="90" y="338" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">INTENSIVE SCALP SERUM</text>

    <!-- Key Actives Bullet Box -->
    <rect x="30" y="352" width="120" height="72" rx="6" fill="#081016" stroke="#1e293b" stroke-width="1" />
    <text x="90" y="369" text-anchor="middle" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">• Biotinyl-GHK Peptide •</text>
    <text x="90" y="384" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="7.5">• Oleanolic Acid (DHT Block) •</text>
    <text x="90" y="399" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="7.5">• Apigenin Microvascular Flow •</text>
    <text x="90" y="414" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5">D-Biotin • Panthenol • Menthol</text>

    <!-- Volume & Standard Badge -->
    <rect x="50" y="445" width="80" height="20" rx="4" fill="#0f2b38" stroke="#0d9488" stroke-width="1" />
    <text x="90" y="458" text-anchor="middle" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">75 mL e 2.5 fl.oz</text>

    <text x="90" y="485" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="7" font-weight="600">DERMATOLOGICALLY TESTED</text>
  </g>

  <!-- ─── FLOATING CLINICAL BADGES ─── -->
  <!-- 2-Pack Double Advantage Pill -->
  <g transform="translate(110, 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="52" rx="10" fill="#0f172a" stroke="url(#tealFoil)" stroke-width="1.5" />
    <text x="20" y="24" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">2-PACK BUNDLE</text>
    <text x="20" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Double Advantage • 150 mL</text>
  </g>

  <!-- 5% Procapil Patent Seal -->
  <g transform="translate(540, 260)" filter="url(#shadow)">
    <rect x="0" y="0" width="155" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">5.0% PROCAPIL®</text>
    <text x="18" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Patented Peptide Matrix</text>
  </g>

  <!-- Non-Minoxidil Shield -->
  <g transform="translate(525, 480)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="52" rx="10" fill="#0f172a" stroke="url(#goldAccent)" stroke-width="1.5" />
    <text x="18" y="24" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">0% MINOXIDIL</text>
    <text x="18" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">No Rebound Hair Shedding</text>
  </g>

  <!-- Footer Brand Signature -->
  <text x="400" y="760" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
    MCG MEDICAL COSMECEUTICAL GROUP • DERMATOLOGICAL TRICHOLOGY
  </text>
</svg>
