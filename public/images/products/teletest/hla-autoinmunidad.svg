<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgGnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgGnt)"/>

  <!-- Subtle Bio-Grid Background -->
  <g opacity="0.15" stroke="#0284c7" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
  </g>

  <!-- Main Diagnostic Kit Box Simulation -->
  <rect x="100" y="80" width="400" height="440" rx="20" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(2, 132, 199, 0.15))"/>
  
  <!-- Header Bar of Kit -->
  <path d="M100 100 Q100 80 120 80 L480 80 Q500 80 500 100 L500 150 L100 150 Z" fill="url(#accentGrad)"/>
  <text x="130" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.1em">TELETEST ANALYTIKA · CLINICAL GENOMICS</text>
  <text x="130" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">ISO 17025 ACCREDITED · AUT. SALUT E08750211</text>

  <!-- Central Scientific Visualization: DNA Double Helix & HLA Receptor -->
  <g transform="translate(300, 260)">
    <!-- Shield Graphic -->
    <path d="M-60 -40 L60 -40 Q70 30 0 80 Q-70 30 -60 -40 Z" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-width="2"/>
    <!-- DNA Strands inside -->
    <path d="M-30 -20 Q0 0 30 -20 M-30 0 Q0 20 30 0 M-30 20 Q0 40 30 20" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-30" cy="-20" r="4" fill="#0284c7"/>
    <circle cx="30" cy="-20" r="4" fill="#0369a1"/>
    <circle cx="-30" cy="0" r="4" fill="#0284c7"/>
    <circle cx="30" cy="0" r="4" fill="#0369a1"/>
    <circle cx="-30" cy="20" r="4" fill="#0284c7"/>
    <circle cx="30" cy="20" r="4" fill="#0369a1"/>
  </g>

  <!-- Test Name on Kit -->
  <text x="300" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="-0.02em">GNT. HLA &amp; AUTOINMUNIDAD</text>
  <text x="300" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0284c7">Tipificación HLA Clase I &amp; II · Susceptibilidad Celíaca</text>
  <text x="300" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Report 18267615 · Muestra: Sangre Periférica / qPCR</text>

  <!-- Feature Pills -->
  <g transform="translate(130, 455)">
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="52" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155">HLA-DQ8 / DQ2</text>
    
    <rect x="115" y="0" width="115" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="172" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155">13 Genes Tipificados</text>

    <rect x="240" y="0" width="95" height="26" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="287" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#047857">Validez 100%</text>
  </g>
</svg>
