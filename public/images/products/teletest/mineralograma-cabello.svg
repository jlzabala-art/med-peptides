<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgHtma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgHtma)"/>

  <!-- Subtle Elemental Grid Background -->
  <g opacity="0.15" stroke="#d97706" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
  </g>

  <!-- Main Diagnostic Kit Box Simulation -->
  <rect x="100" y="80" width="400" height="440" rx="20" fill="url(#cardGrad2)" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(217, 119, 6, 0.15))"/>
  
  <!-- Header Bar of Kit -->
  <path d="M100 100 Q100 80 120 80 L480 80 Q500 80 500 100 L500 150 L100 150 Z" fill="url(#goldGrad)"/>
  <text x="130" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.1em">TELETEST ANALYTIKA · TOXICOLOGY &amp; HTMA</text>
  <text x="130" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fef3c7">ICP-MS/MS TRIPLE QUAD · ISO 17025 ACCREDITED</text>

  <!-- Central Scientific Visualization: Hair Follicle & Periodic Trace Matrix -->
  <g transform="translate(300, 260)">
    <!-- Spectrometry Concentric Rings -->
    <circle cx="0" cy="0" r="55" fill="#f59e0b" fill-opacity="0.08" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="22" fill="#d97706" fill-opacity="0.15"/>
    <!-- Elemental symbols in orbit -->
    <text x="-35" y="-15" font-family="monospace" font-size="12" font-weight="900" fill="#b45309">Mg</text>
    <text x="20" y="-20" font-family="monospace" font-size="12" font-weight="900" fill="#b45309">Zn</text>
    <text x="-25" y="32" font-family="monospace" font-size="12" font-weight="900" fill="#b45309">Ca</text>
    <text x="18" y="28" font-family="monospace" font-size="12" font-weight="900" fill="#b45309">Se</text>
    <text x="0" y="6" text-anchor="middle" font-family="monospace" font-size="15" font-weight="900" fill="#78350f">ICP</text>
  </g>

  <!-- Test Name on Kit -->
  <text x="300" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="-0.02em">MINERALOGRAMA EN CABELLO</text>
  <text x="300" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d97706">33 Minerales &amp; Metales Pesados · 10 Ratios Metabólicos</text>
  <text x="300" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Report 18267691 · Muestra: Cabello / ICP-MS/MS</text>

  <!-- Feature Pills -->
  <g transform="translate(130, 455)">
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="52" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155">33 Elementos</text>
    
    <rect x="115" y="0" width="115" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="172" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155">10 Ratios Adrenales</text>

    <rect x="240" y="0" width="95" height="26" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="287" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#047857">Validez 100%</text>
  </g>
</svg>
