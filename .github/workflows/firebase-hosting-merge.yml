name: Deploy to Production (Fast Path Cloud Run & Hosting)
'on':
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-v3-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v3-${{ hashFiles('**/package-lock.json') }}-

      - name: Write environment variables to .env.production
        # NEXT_PUBLIC_* vars must be present at BUILD TIME to be baked into client bundle.
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_API_KEY=${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Build Next.js application (Turbopack Standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MED_PEPTIDES_APP }}'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev

      - name: Build & Tag Container Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/med-peptides-app/cloud-run-source-deploy/ssr-app:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/med-peptides-app/cloud-run-source-deploy/ssr-app:latest .

      - name: Push Container Image to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/med-peptides-app/cloud-run-source-deploy/ssr-app:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/med-peptides-app/cloud-run-source-deploy/ssr-app:latest

      - name: Deploy revision to Cloud Run (Ultra-Fast)
        run: |
          gcloud run deploy ssrmedpeptidesapp27a3a \
            --image=us-central1-docker.pkg.dev/med-peptides-app/cloud-run-source-deploy/ssr-app:${{ github.sha }} \
            --region=us-central1 \
            --project=med-peptides-app \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=180 \
            --update-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }},PORT=8080"

      - name: Prepare Firebase Hosting Static CDN Assets
        run: node scripts/prepare-hosting.mjs

      - name: Deploy Firebase Hosting (CDN & Rewrites)
        run: npx --no-install firebase-tools deploy --only hosting --project med-peptides-app --non-interactive

      - name: Record Deployment Summary
        if: success()
        run: |
          echo "### 🚀 Production Deployment Succeeded (Fast Path Cloud Run)!" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** [med-peptides.com](https://med-peptides.com)" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin Console:** [med-peptides.com/admin](https://med-peptides.com/admin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Run Service:** \`ssrmedpeptidesapp27a3a\`" >> $GITHUB_STEP_SUMMARY
